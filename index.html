<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A fun, interactive, and vibrant math learning game for children to practice addition, subtraction, and multiplication.">
    <title>🎈 Kids Math Learning Adventure 🌟</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti for Celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #6C5CE7;
            --primary-dark: #5A4AD1;
            --secondary: #00CEC9;
            --accent-yellow: #FDCB6E;
            --correct-green: #00B894;
            --wrong-red: #FF7675;
            --bg-color: #EBF3FF;
            --card-bg: #FFFFFF;
            --text-dark: #2D3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', cursive, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#6C5CE7 0.75px, transparent 0.75px), radial-gradient(#00CEC9 0.75px, var(--bg-color) 0.75px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .game-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 520px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(108, 92, 231, 0.15), 0 0 0 6px #FFFFFF, 0 0 0 10px var(--primary);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary), #a29bfe);
            color: white;
            text-align: center;
            padding: 18px 15px;
            position: relative;
        }

        header h1 {
            font-size: 1.75rem;
            letter-spacing: 0.5px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.15);
        }

        /* Scoreboard Bar */
        .scoreboard {
            display: flex;
            justify-content: space-around;
            background: #F4F0FF;
            padding: 12px 10px;
            border-bottom: 2px dashed #E0D4FF;
        }

        .stat-badge {
            background: white;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-dark);
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Controls Section */
        .controls-section {
            padding: 15px;
            display: flex;
            gap: 12px;
            background: #FAFAFD;
        }

        .control-group {
            flex: 1;
            background: white;
            padding: 10px;
            border-radius: 16px;
            border: 2px solid #EAEAEA;
        }

        .control-group h3 {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            text-align: center;
        }

        .radio-options {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }

        .opt-btn {
            background: #F0F0F5;
            border: 2px solid transparent;
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1 1 40%;
            text-align: center;
        }

        .opt-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
        }

        /* Problem Display Card */
        .card-area {
            padding: 20px 15px 10px 15px;
            text-align: center;
        }

        .math-problem {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0px #E8E3FF;
        }

        .answer-box {
            width: 140px;
            height: 60px;
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            border: 4px solid var(--primary);
            border-radius: 16px;
            outline: none;
            background: #FFF;
            color: var(--text-dark);
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.08);
            transition: border-color 0.2s;
        }

        .answer-box:focus {
            border-color: var(--secondary);
        }

        /* Numpad */
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 320px;
            margin: 15px auto 10px auto;
            padding: 0 10px;
        }

        .num-btn {
            background: var(--accent-yellow);
            border: none;
            border-bottom: 5px solid #E6B04C;
            border-radius: 16px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
            padding: 12px 0;
            cursor: pointer;
            transition: all 0.1s;
        }

        .num-btn:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        .num-btn.clear-btn {
            background: #FAB1A0;
            border-bottom-color: #E17055;
            color: white;
        }

        /* Actions */
        .action-area {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 10px 20px;
        }

        .submit-btn {
            background: var(--correct-green);
            border: none;
            border-bottom: 5px solid #009475;
            color: white;
            font-size: 1.25rem;
            font-weight: 700;
            padding: 12px 28px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.15s ease;
            flex: 2;
        }

        .submit-btn:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        .skip-btn {
            background: #B2BEC3;
            border: none;
            border-bottom: 5px solid #636E72;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 18px;
            border-radius: 20px;
            cursor: pointer;
            flex: 1;
        }

        /* Feedback Message */
        .feedback {
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-dark);
            padding: 5px 15px 15px 15px;
        }

        .correct-anim {
            color: var(--correct-green);
            animation: pop 0.4s ease;
        }

        .wrong-anim {
            color: var(--wrong-red);
            animation: shake 0.4s ease;
        }

        @keyframes pop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        @media (max-width: 480px) {
            .math-problem { font-size: 2.8rem; }
            .answer-box { width: 120px; height: 52px; font-size: 1.8rem; }
            .num-btn { padding: 10px 0; font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <div class="game-container" id="app">
        <!-- Header -->
        <header>
            <h1>🎈 Math Learning Adventure! 🎈</h1>
        </header>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="stat-badge">🏆 Score: <span id="score">0</span></div>
            <div class="stat-badge">🔥 Streak: <span id="streak">0</span></div>
            <div class="stat-badge">⭐ Stars: <span id="stars">0</span></div>
        </div>

        <!-- Mode & Difficulty Selectors -->
        <div class="controls-section">
            <div class="control-group">
                <h3>Mode</h3>
                <div class="radio-options" id="mode-options">
                    <button class="opt-btn active" data-mode="+">➕ Add</button>
                    <button class="opt-btn" data-mode="-">➖ Sub</button>
                    <button class="opt-btn" data-mode="*">✖️ Mult</button>
                    <button class="opt-btn" data-mode="mixed">🎲 Mixed</button>
                </div>
            </div>

            <div class="control-group">
                <h3>Level</h3>
                <div class="radio-options" id="diff-options">
                    <button class="opt-btn active" data-diff="easy">Easy (1-10)</button>
                    <button class="opt-btn" data-diff="medium">Med (1-20)</button>
                    <button class="opt-btn" data-diff="hard">Hard (1-50)</button>
                </div>
            </div>
        </div>

        <!-- Problem Display -->
        <div class="card-area">
            <div class="math-problem" id="problem-text">7 + 5 = ?</div>
            <input type="text" id="answer-input" class="answer-box" readonly placeholder="?" autofocus />
        </div>

        <!-- On-Screen Numpad -->
        <div class="numpad">
            <button class="num-btn" onclick="pressNum('7')">7</button>
            <button class="num-btn" onclick="pressNum('8')">8</button>
            <button class="num-btn" onclick="pressNum('9')">9</button>
            <button class="num-btn" onclick="pressNum('4')">4</button>
            <button class="num-btn" onclick="pressNum('5')">5</button>
            <button class="num-btn" onclick="pressNum('6')">6</button>
            <button class="num-btn" onclick="pressNum('1')">1</button>
            <button class="num-btn" onclick="pressNum('2')">2</button>
            <button class="num-btn" onclick="pressNum('3')">3</button>
            <button class="num-btn clear-btn" onclick="pressClear()">C</button>
            <button class="num-btn" onclick="pressNum('0')">0</button>
            <button class="num-btn clear-btn" onclick="pressBackspace()">⌫</button>
        </div>

        <!-- Actions -->
        <div class="action-area">
            <button class="submit-btn" id="submit-btn" onclick="checkAnswer()">🚀 Submit!</button>
            <button class="skip-btn" onclick="generateQuestion()">⏩ Skip</button>
        </div>

        <!-- Feedback Banner -->
        <div class="feedback" id="feedback">
            Tap numbers & hit Submit! ⭐
        </div>
    </div>

    <script>
        // Game State
        let score = 0;
        let streak = 0;
        let stars = 0;
        let currentNum1 = 0;
        let currentNum2 = 0;
        let currentOperator = '+';
        let correctAnswer = 0;
        let selectedMode = '+';
        let selectedDiff = 'easy';

        const problemText = document.getElementById('problem-text');
        const answerInput = document.getElementById('answer-input');
        const feedbackEl = document.getElementById('feedback');
        const scoreEl = document.getElementById('score');
        const streakEl = document.getElementById('streak');
        const starsEl = document.getElementById('stars');

        // Audio synth for fun sound effects without external files
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
                    osc.frequency.setValueAtTime(180, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch(e){}
        }

        // Mode & Diff selection listener setup
        document.querySelectorAll('#mode-options .opt-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#mode-options .opt-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedMode = btn.dataset.mode;
                generateQuestion();
            });
        });

        document.querySelectorAll('#diff-options .opt-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#diff-options .opt-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedDiff = btn.dataset.diff;
                generateQuestion();
            });
        });

        // Numpad handlers
        function pressNum(digit) {
            if (answerInput.value.length < 5) {
                answerInput.value += digit;
            }
        }

        function pressClear() {
            answerInput.value = '';
        }

        function pressBackspace() {
            answerInput.value = answerInput.value.slice(0, -1);
        }

        // Keyboard listening
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                pressNum(e.key);
            } else if (e.key === 'Enter') {
                checkAnswer();
            } else if (e.key === 'Backspace') {
                pressBackspace();
            } else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') {
                pressClear();
            }
        });

        // Question Generator
        function generateQuestion() {
            answerInput.value = '';
            
            let maxNum = 10;
            if (selectedDiff === 'medium') maxNum = 20;
            if (selectedDiff === 'hard') maxNum = 50;

            let op = selectedMode;
            if (op === 'mixed') {
                const ops = ['+', '-', '*'];
                op = ops[Math.floor(Math.random() * ops.length)];
            }
            currentOperator = op;

            if (op === '+') {
                currentNum1 = Math.floor(Math.random() * maxNum) + 1;
                currentNum2 = Math.floor(Math.random() * maxNum) + 1;
                correctAnswer = currentNum1 + currentNum2;
                problemText.textContent = `${currentNum1} + ${currentNum2} = ?`;
            } else if (op === '-') {
                let n1 = Math.floor(Math.random() * maxNum) + 1;
                let n2 = Math.floor(Math.random() * maxNum) + 1;
                currentNum1 = Math.max(n1, n2);
                currentNum2 = Math.min(n1, n2);
                correctAnswer = currentNum1 - currentNum2;
                problemText.textContent = `${currentNum1} − ${currentNum2} = ?`;
            } else if (op === '*') {
                let mMax = selectedDiff === 'hard' ? 12 : 10;
                currentNum1 = Math.floor(Math.random() * mMax) + 1;
                currentNum2 = Math.floor(Math.random() * 10) + 1;
                correctAnswer = currentNum1 * currentNum2;
                problemText.textContent = `${currentNum1} × ${currentNum2} = ?`;
            }
        }

        // Answer Validation
        function checkAnswer() {
            const userVal = answerInput.value.trim();
            if (userVal === '') {
                feedbackEl.textContent = 'Please enter an answer! ✏️';
                feedbackEl.className = 'feedback wrong-anim';
                return;
            }

            const val = parseInt(userVal, 10);
            if (val === correctAnswer) {
                streak++;
                stars++;
                score += 10 * (1 + Math.floor(streak / 3));

                scoreEl.textContent = score;
                streakEl.textContent = streak;
                starsEl.textContent = stars;

                playSound('correct');
                
                // Trigger confetti celebratory effect
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 50,
                        spread: 60,
                        origin: { y: 0.7 }
                    });
                }

                const praises = ["🌟 Super Star! Correct!", "🎉 Awesome Job!", "🔥 On Fire! Keep Going!", "🏆 Fantastic!", "🎈 You Got It!"];
                let msg = praises[Math.floor(Math.random() * praises.length)];
                if (streak >= 3) msg += ` (🔥 Streak x${streak}!)`;

                feedbackEl.textContent = msg;
                feedbackEl.className = 'feedback correct-anim';

                generateQuestion();
            } else {
                streak = 0;
                streakEl.textContent =  streak;
                playSound('wrong');

                feedbackEl.textContent = `Oops! ${currentNum1} ${currentOperator === '*' ? '×' : (currentOperator === '-' ? '−' : '+')} ${currentNum2} is ${correctAnswer}. Try next! 💪`;
                feedbackEl.className = 'feedback wrong-anim';

                generateQuestion();
            }
        }

        // Start initial question
        generateQuestion();
    </script>
</body>
</html>
